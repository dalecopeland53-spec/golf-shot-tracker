name: Build DRC Shot Tracker APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Shot Tracker project
        uses: actions/checkout@v4

      - name: Unzip approved Android app
        run: unzip -o BetterGolfAndroidProject.zip

      - name: Keep approved home screen and install DRC launcher icon
        run: |
          mkdir -p BetterGolfAndroid/app/src/main/res/drawable-nodpi
          base64 -d assets/drc-shot-tracker-master.base64 > BetterGolfAndroid/app/src/main/res/drawable-nodpi/drc_shot_tracker.jpg
          MANIFEST="BetterGolfAndroid/app/src/main/AndroidManifest.xml"
          sed -i 's#android:label="[^"]*"#android:label="DRC Shot Tracker"#' "$MANIFEST"
          sed -i 's#android:icon="[^"]*"#android:icon="@drawable/drc_shot_tracker"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then
            sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@drawable/drc_shot_tracker"#' "$MANIFEST"
          fi

      - name: Set fresh Android package and version
        run: |
          KTS="BetterGolfAndroid/app/build.gradle.kts"
          GROOVY="BetterGolfAndroid/app/build.gradle"
          if [ -f "$KTS" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.drc.shottracker.build20"/' "$KTS"
            sed -i 's/versionCode = [0-9][0-9]*/versionCode = 20/' "$KTS"
            sed -i 's/versionName = "[^"]*"/versionName = "1.0.20"/' "$KTS"
          elif [ -f "$GROOVY" ]; then
            sed -i "s/applicationId ['\"][^'\"]*['\"]/applicationId 'com.drc.shottracker.build20'/" "$GROOVY"
            sed -i 's/versionCode [0-9][0-9]*/versionCode 20/' "$GROOVY"
            sed -i "s/versionName ['\"][^'\"]*['\"]/versionName '1.0.20'/" "$GROOVY"
          else
            echo "No app Gradle file found"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Shot Tracker APK
        working-directory: BetterGolfAndroid
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp BetterGolfAndroid/app/build/outputs/apk/debug/app-debug.apk DRC-SHOT-TRACKER-BUILD-20.apk

      - name: Upload Shot Tracker APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-SHOT-TRACKER-BUILD-20
          path: DRC-SHOT-TRACKER-BUILD-20.apk
          if-no-files-found: error

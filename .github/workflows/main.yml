name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: unzip BetterGolfAndroidProject.zip

      - name: Apply approved DRC logo
        run: |
          mkdir -p BetterGolfAndroid/app/src/main/res/drawable-nodpi
          cp assets/drc-virtual-golf-elite.jpg BetterGolfAndroid/app/src/main/res/drawable-nodpi/drc_virtual_golf_elite.jpg
          MANIFEST="BetterGolfAndroid/app/src/main/AndroidManifest.xml"
          sed -i 's#android:icon="[^"]*"#android:icon="@drawable/drc_virtual_golf_elite"#' "$MANIFEST"
          if grep -q 'android:roundIcon=' "$MANIFEST"; then
            sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@drawable/drc_virtual_golf_elite"#' "$MANIFEST"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: BetterGolfAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Golf-APK
          path: BetterGolfAndroid/app/build/outputs/apk/debug/app-debug.apk

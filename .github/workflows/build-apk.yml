name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify premium home source
        run: |
          grep -q "DRC ELITE GOLF" index.html
          grep -q "REAL DATA. A BETTER GAME." index.html
          grep -q "BALL FLIGHT" index.html

      - name: Prepare web app
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html www/index.html
          grep -q "DRC ELITE GOLF" www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync app and update platform assets
        run: |
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name APK clearly
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DRC-Elite-Golf-Shot-Tracker-LATEST.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Elite-Golf-Shot-Tracker-APK
          path: DRC-Elite-Golf-Shot-Tracker-LATEST.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="drc-shot-tracker-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DRC-Elite-Golf-Shot-Tracker-LATEST.apk --clobber
          else
            gh release create "$TAG" DRC-Elite-Golf-Shot-Tracker-LATEST.apk --target "$GITHUB_SHA" --title "DRC Elite Golf Shot Tracker - Latest APK" --notes "Permanent Android APK download for the current DRC Elite Golf Shot Tracker build."
          fi
        run: npm install

      - name: Verify premium home source
        run: |
          grep -q "DRC ELITE GOLF" index.html
          grep -q "REAL DATA. A BETTER GAME." index.html
          grep -q "BALL FLIGHT" index.html

      - name: Prepare web app
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html www/index.html
          grep -q "DRC ELITE GOLF" www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync app
        run: |
          npx cap sync android
          grep -q "DRC ELITE GOLF" android/app/src/main/assets/public/index.html

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name APK clearly
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DRC-Elite-Golf-Shot-Tracker-LATEST.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRC-Elite-Golf-Shot-Tracker-APK
          path: DRC-Elite-Golf-Shot-Tracker-LATEST.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="drc-shot-tracker-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" DRC-Elite-Golf-Shot-Tracker-LATEST.apk --clobber
          else
            gh release create "$TAG" DRC-Elite-Golf-Shot-Tracker-LATEST.apk --target "$GITHUB_SHA" --title "DRC Elite Golf Shot Tracker - Latest APK" --notes "Permanent Android APK download for the current DRC Elite Golf Shot Tracker build."
          fi
